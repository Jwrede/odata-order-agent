[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odata-order-agent"
version = "0.1.0"
description = "LLM agent that turns customer order mails into sales orders in a SAP CAP OData service, with ERP-side roles, a release gate, human approval, an MCP tool server and a recorded evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
order-agent = "order_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
